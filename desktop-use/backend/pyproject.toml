[project]
name = "alfred-desktop-use-backend"
version = "0.1.0"
description = "FastAPI tool-calling agent backend for Alfred-OS desktop use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
