<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob:">
  <title>Alfred</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stack">
    <section id="card" class="card" role="status" aria-live="polite" hidden>
      <p class="heard"></p>
      <p class="answer"></p>
      <ol class="steps"></ol>
      <div class="chips"></div>
      <div class="actions" hidden>
        <button type="button" class="btn yes">Yes, do it</button>
        <button type="button" class="btn no">No</button>
      </div>
      <p class="hint"></p>
    </section>

    <div id="pill" class="pill idle" aria-label="Alfred">
      <span class="dot" aria-hidden="true"></span>
      <span class="bars" aria-hidden="true">
        <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
        <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
      </span>
      <span class="label"></span>
    </div>
  </main>
  <script src="ui.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
